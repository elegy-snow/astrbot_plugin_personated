<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拟人化日程管理</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-main">
        <div class="header-titles">
          <h1>🕒 拟人化日程管理</h1>
          <p class="subtitle">每日作息规划、时间段定义与实时上下文看板</p>
        </div>
        <div class="header-clock-panel">
          <div class="clock-time" id="clock-time">--:--:--</div>
          <div class="clock-date" id="clock-date">----年--月--日 星期-</div>
        </div>
      </div>
      <div class="header-status-bar" id="header-status-bar">
        <span class="status-indicator"></span>
        <span id="current-active-desc">正在同步日程状态...</span>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="tab-btn active" data-tab="tab-today">📅 今日作息看板</button>
      <button class="tab-btn" data-tab="tab-settings">⚙️ 时间段与系统设置</button>
    </nav>

    <!-- TAB 1: 今日作息看板 -->
    <main id="tab-today" class="tab-content active">
      <!-- 实时状态大卡片 -->
      <section class="card current-status-card" id="current-status-card">
        <div class="card-header">
          <h2>🌟 当前进行中时段</h2>
          <span class="badge active-badge" id="now-segment-badge">检测中</span>
        </div>
        <div class="current-activity-body">
          <div class="activity-field">
            <span class="field-label">当前正在进行：</span>
            <p class="field-value highlight" id="now-activity">--</p>
          </div>
          <div class="activity-field">
            <span class="field-label">当下心情与心理状态：</span>
            <p class="field-value" id="now-state">--</p>
          </div>
        </div>
      </section>

      <!-- 操作工具栏 -->
      <div class="toolbar">
        <div class="toolbar-info">
          <span>今日生成模型：<strong id="info-provider">--</strong></span>
          <span class="separator">|</span>
          <span>生成时刻：<strong id="info-gentime">--</strong></span>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-secondary" id="btn-refresh-view">🔄 刷新数据</button>
          <button class="btn btn-primary" id="btn-regenerate">✨ 重新生成今日日程</button>
        </div>
      </div>

      <!-- 全天时间轴列表 -->
      <section class="timeline-section">
        <h3>全天日程时间轴</h3>
        <div class="timeline-container" id="timeline-container">
          <div class="empty-state">正在加载今日日程...</div>
        </div>
      </section>
    </main>

    <!-- TAB 2: 时间段与系统设置 -->
    <main id="tab-settings" class="tab-content">
      <!-- 基础生成配置 -->
      <section class="card">
        <div class="card-header">
          <h2>⏰ 每日生成与模型设定</h2>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="input-gen-time">
              每日自动生成时刻 (24小时制)
              <span class="hint-text">每天在此时间点自动为当天规划作息</span>
            </label>
            <input type="time" id="input-gen-time" value="04:00" class="input-control" />
          </div>

          <div class="form-group">
            <label for="select-provider">
              指定生成模型提供商
              <span class="hint-text">未指定或留空时将自动回退使用当前对话模型</span>
            </label>
            <select id="select-provider" class="input-control">
              <option value="">(留空自动回退对话模型)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="select-inject-mode">
              对话上下文注入模式
              <span class="hint-text">推荐使用附加用户块（保护服务端模型KV缓存）</span>
            </label>
            <select id="select-inject-mode" class="input-control">
              <option value="extra_user_content">附加用户内容块 (extra_user_content - 推荐)</option>
              <option value="system_prompt">追加到人设提示词末尾 (system_prompt)</option>
            </select>
          </div>

          <div class="form-group checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="checkbox-inject-enabled" checked />
              <span class="checkbox-custom"></span>
              <span>启用对话上下文注入（对话时自动代入当前日程与状态）</span>
            </label>
          </div>
        </div>
      </section>

      <!-- 时间段划分列表管理 -->
      <section class="card segments-card">
        <div class="card-header">
          <div>
            <h2>📋 每日时间段划分管理</h2>
            <p class="section-desc">自定义一天划分几段作息及精确起止时刻（24h制，精确到分钟，支持跨午夜）。</p>
          </div>
          <div class="card-actions">
            <button class="btn btn-secondary btn-sm" id="btn-reset-segments">恢复默认预设</button>
            <button class="btn btn-outline btn-sm" id="btn-add-segment">➕ 添加新时间段</button>
          </div>
        </div>

        <div class="segments-table-wrapper">
          <table class="segments-table">
            <thead>
              <tr>
                <th style="width: 60px;">序号</th>
                <th style="width: 140px;">时间段标识 ID</th>
                <th>时段名称</th>
                <th style="width: 130px;">开始时刻</th>
                <th style="width: 130px;">结束时刻</th>
                <th style="width: 90px;">特性</th>
                <th style="width: 120px;">操作</th>
              </tr>
            </thead>
            <tbody id="segments-table-body">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- 保存操作栏 -->
      <div class="save-bar">
        <span id="save-status-msg" class="save-status-msg"></span>
        <button class="btn btn-primary btn-lg" id="btn-save-settings">💾 保存所有配置</button>
      </div>
    </main>

    <!-- 编辑单个时段活动模态框 -->
    <div class="modal-overlay" id="edit-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-title">编辑今日时段安排</h3>
          <button class="modal-close" id="modal-close">&times;</button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-item-id" />
          <div class="form-group">
            <label>时段名称与范围</label>
            <p id="edit-item-meta" class="item-meta-text">--</p>
          </div>
          <div class="form-group">
            <label for="edit-item-activity">当前具体在做的事情 (Activity)</label>
            <textarea id="edit-item-activity" class="textarea-control" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="edit-item-state">当前心情与心理状态 (State)</label>
            <input type="text" id="edit-item-state" class="input-control" />
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="modal-cancel">取消</button>
          <button class="btn btn-primary" id="modal-save">保存修改</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
