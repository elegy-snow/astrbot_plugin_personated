name: astrbot_plugin_personated
display_name: 拟人化综合伴侣
desc: 拟人化综合功能集合插件，支持每日定时生成作息日程并在对话中注入实时状态；支持对特定群聊/私聊进行专属提示词定制注入；主动兼容 NAI 生图插件的伴侣直连联动模式（NovelAI 4.5 标签语法与作息情境融合生图）；提供拟人生活日记归档与书架作品创作管理（含私密抽屉夹层）。
short_desc: 作息日程 + 会话专属提示词 + NAI直连生图 + 拟人日记 + 书架创作
version: v1.3.0
author: elegy-snow
repo: https://github.com/elegy-snow/astrbot_plugin_personated
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - wecom
  - lark
  - dingtalk
  - discord
  - slack
  - kook
  - satori
  - webchat
astrbot_version: ">=4.5.7"
pages:
  - name: schedule
    title: 拟人化日程管理
    desc: 可视化日程时间轴、实时状态看板与作息规则管理
views:
